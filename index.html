<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jyoverse.</title>
<style>
body{margin:0;background:#f7f1e8;color:#49352b;font-family:Georgia;text-align:center}
header{padding:20px;font-size:28px}
nav{position:fixed;bottom:0;background:#fffaf3;width:100%;padding:15px 0}
button{padding:10px;margin:5px;background:#49352b;color:white;border:0}
img{width:90%;max-height:55vh;object-fit:contain}
.page{display:none;padding:20px 10px 90px}
.active{display:block}
.card{display:inline-block;width:44%;margin:2%;background:#fffaf3;padding:5px}
.card img{width:100%;height:180px;object-fit:cover}
</style>
</head>
<body>
<header>Jyoverse.</header>

<section id="home" class="page active">
<h1>Art made with heart</h1>
<img id="photo" src="images/art1.jpg">
<h3 id="name">Devotional Art</h3>
<p id="size">Size: A4</p>
<button onclick="slide(-1)">❮</button>
<button onclick="slide(1)">❯</button>
</section>

<section id="art" class="page">
<h2>My Artworks</h2>
<div id="gallery"></div>
</section>

<section id="about" class="page">
<h2>About Jyoverse.</h2>
<p>Handmade art created with love.</p>
<p>Custom orders available on Instagram.</p>
<button onclick="instagram()">Contact on Instagram</button>
</section>

<section id="cart" class="page">
<h2>My Cart</h2>
<div id="items"></div>
<p id="total">Total: ₹0</p>
<label><input type="checkbox" id="frame" onchange="showCart()"> Add framing ₹149 per artwork</label>
<button onclick="checkout()">Order on Instagram</button>
</section>

<nav>
<button onclick="page('home')">Home</button>
<button onclick="page('art')">Art</button>
<button onclick="page('about')">About</button>
<button onclick="page('cart')">Cart</button>
</nav>

<script>
const arts=[
{name:"Devotional Art",size:"A4",price:799,img:"images/art1.jpg"},
{name:"Mandala Art",size:"A5",price:399,img:"images/art2.jpg"},
{name:"Shadow Art",size:"A4",price:599,img:"images/art3.jpg"}
];
let index=0,cart=[];

function slide(n){
 index=(index+n+arts.length)%arts.length;
 photo.src=arts[index].img;
 name.textContent=arts[index].name;
 size.textContent="Size: "+arts[index].size;
}

function page(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 if(id==="art")gallery.innerHTML=arts.map((a,i)=>
 `<div class="card"><img src="${a.img}"><h3>${a.name}</h3>
 <p>${a.size} · ₹${a.price}</p>
 <button onclick="add(${i})">Add to Cart</button></div>`).join("");
 if(id==="cart")showCart();
}

function add(i){cart.push(i);alert("Added to cart")}
function showCart(){
 items.innerHTML=cart.map(i=>arts[i].name+" — ₹"+arts[i].price).join("<br>");
 let total=cart.reduce((s,i)=>s+arts[i].price,0);
 if(frame.checked)total+=cart.length*149;
 document.getElementById("total").textContent="Total: ₹"+total;
}

function instagram(){
 window.open("https://instagram.com/jyoverse.art","_blank");
}

function checkout(){
 if(!cart.length){alert("Cart is empty");return}
 let message="Hi Jyoverse.! I want to order:\\n"+
 cart.map(i=>arts[i].name+" - ₹"+arts[i].price).join("\\n");
 if(frame.checked)message+="\\nFraming selected";
 prompt("Copy this message and send it on Instagram:",message);
 instagram();
}
</script>
</body>
</html>
